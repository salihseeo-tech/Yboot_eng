name: 🎬 توليد ونشر قصة تلقائية

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات تلقائياً
  workflow_dispatch:          # تشغيل يدوي من GitHub لو تحتاج

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. تحميل الكود ──────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. مكتبات النظام ─────────────────────────
      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-freefont-ttf \
            imagemagick

      # ── 4. مكتبات Python ─────────────────────────
      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. استرجاع السجل السابق ──────────────────
      - name: 📂 Restore history
        uses: actions/cache@v4
        with:
          path: history.json
          key: history-${{ github.run_number }}
          restore-keys: history-

      # ── 6. تشغيل المشروع ─────────────────────────
      - name: 🚀 Generate & Publish
        env:
          GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CREDENTIALS_JSON:    ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: python main.py

      # ── 7. رفع الفيديو كـ artifact ───────────────
      - name: 📤 Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7

      # ── 8. حفظ السجل للتشغيل القادم ─────────────
      - name: 💾 Save history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: history.json
          key: history-${{ github.run_number }}
